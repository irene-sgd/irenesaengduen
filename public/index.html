<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    color-scheme: light;
    --bg-base: #ffffff;
    --bg-elevated: #f2f2f2;
    --text: #000000;
    --text-subdued: #5e5e5e;
    --border-essential: #7c7c7c;
    --font: SpotifyMixUI, CircularSp-Arab, CircularSp-Cyrl, "Helvetica Neue", helvetica, arial, "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-base); }
  body {
    margin: 0;
    background: var(--bg-base);
    color: var(--text);
    font: 400 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--text); color: var(--bg-base); }


  .plane {
    position: fixed;
    top: 0;
    left: 0;
    width: 64px;
    height: 40px;
    margin: -20px 0 0 -32px;
    z-index: 100;
    pointer-events: none;
    will-change: transform;
  }
  .plane svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .plane path { stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .js .plane { visibility: hidden; }
  .decor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .deco { position: absolute; height: auto; will-change: transform; }
  .deco-s { width: clamp(40px, 6vw, 88px); }
  .deco-m { width: clamp(56px, 8vw, 120px); }
  .deco-l { width: clamp(72px, 11vw, 170px); }
  .js .deco { opacity: 0; }

  .panel { display: contents; }
  .stack { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 576px; margin: 0 auto; padding: 8px; }
  .sheet {
    flex: none;
    position: sticky;
    top: 8px;
    z-index: 1;
    height: calc(100svh - 16px);
    transform-origin: 50% 0;
  }
  .player { position: sticky; top: 8px; z-index: 1; padding-bottom: 8px; }
  .player-frame { height: 152px; border-radius: 12px; overflow: hidden; }
  .player iframe { display: block; width: 100%; height: 100%; border: 0; }
  .player-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; margin-top: 8px; padding: 8px 16px; border: 0; border-radius: 9999px; background: transparent; color: var(--text); font: 700 14px/1 var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--border-essential); transition: transform 33ms; }
  .player-toggle:hover { box-shadow: inset 0 0 0 1px var(--text); transform: scale(1.02); }
  .player-toggle:active { transform: scale(1); opacity: 0.7; }
  .player-toggle:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .player-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s; }
  .player-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .card {
    z-index: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    padding: 40px;
    border-radius: 8px;
    background: var(--bg-elevated) url("textures/paper.webp") center / cover no-repeat;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.25rem);
    line-height: 0.98;
    letter-spacing: -0.03em;
    font-weight: 700;
    text-wrap: balance;
  }


  .card p { margin: 0; }
  .aka { margin-top: 8px !important; color: var(--text-subdued); }
  .role { margin-top: 24px !important; max-width: 36ch; }
  .site { display: inline-flex; align-items: center; gap: 4px; color: var(--text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .site:focus-visible, .social a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .arrow { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .card h2 { margin: 32px 0 12px; font-size: 14px; line-height: 1.25; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subdued); }
  .social { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; max-width: calc(100% - 80px); }
  .social span { white-space: nowrap; }
  .social a { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 9999px; color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; box-shadow: inset 0 0 0 1px var(--border-essential); transition: transform 33ms; }
  .social a:hover { box-shadow: inset 0 0 0 1px var(--text); transform: scale(1.04); }
  .social a:active { transform: scale(1); opacity: 0.7; }
  .social svg { width: 18px; height: 18px; flex-shrink: 0; }
  .polaroid {
    width: 168px;
    margin: 0 auto 24px;
    padding: 10px 10px 40px;
    border-radius: 2px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14), 0 8px 18px rgba(0, 0, 0, 0.12);
    transform: rotate(-4deg);
  }
  .polaroid img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; object-position: 62% 38%; filter: contrast(1.04) saturate(0.92); }
  .js .polaroid { opacity: 0; }
  .flower {
    position: absolute;
    right: 8px;
    bottom: -2px;
    height: 150px;
    aspect-ratio: 96 / 150;
    transform-origin: 50% 100%;
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .flower-stem { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .flower-stem path { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .flower-head { position: absolute; left: 15.6%; top: 23.3%; width: 72.9%; height: auto; transform-origin: 50% 50%; }
  .js .flower { visibility: hidden; }
  .js .flower-head { opacity: 0; }

  @media (max-width: 900px) {
    .card { padding: 24px 16px; }
  }
  @media (min-width: 0px) {
    .card { padding-bottom: 128px; text-align: center; }
    .role { max-width: none; }
    .social { flex-direction: column; align-items: stretch; max-width: none; }
    .social a { width: 100%; justify-content: center; }
    .flower { left: 0; right: 0; margin-inline: auto; bottom: -2px; height: 112px; }
  }
  @media (min-width: 641px) {
    body { display: block; min-height: 0; padding: 0; }
    .stack { display: block; max-width: none; padding: 0; }
    .panel {
      position: sticky;
      top: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      height: 100svh;
      padding: 8px;
    }
    .card.sheet { position: relative; top: auto; height: auto; max-width: 560px; transform-origin: 50% 50%; }
    .player { position: relative; top: auto; width: 100%; max-width: 560px; }
  }
</style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    (function () {
      var items = gsap.utils.toArray(".deco");
      gsap.registerPlugin(MotionPathPlugin, ScrollTrigger);

      var btn = document.querySelector(".player-toggle");
      var frame = document.getElementById("player-frame");
      var label = btn.querySelector("span");
      btn.addEventListener("click", function () {
        var open = btn.getAttribute("aria-expanded") === "true";
        var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        btn.setAttribute("aria-expanded", String(!open));
        label.textContent = open ? "Show tracklist" : "Hide tracklist";
        gsap.to(frame, {
          height: open ? 152 : 352,
          duration: still ? 0 : 0.5,
          ease: "power2.inOut",
          onUpdate: function () { ScrollTrigger.refresh(); },
          onComplete: function () { ScrollTrigger.refresh(); }
        });
      });
      var mm = gsap.matchMedia();

      mm.add("(prefers-reduced-motion: no-preference)", function () {
        var corners = {
          tl: function () { return { x: 0, y: 0 }; },
          tr: function () { return { x: innerWidth, y: 0 }; },
          bl: function () { return { x: 0, y: innerHeight }; },
          br: function () { return { x: innerWidth, y: innerHeight }; }
        };
        function fromCorner(axis) {
          return function (i, el) {
            var r = el.getBoundingClientRect();
            var cx = r.left + r.width / 2 - (gsap.getProperty(el, "x") || 0);
            var cy = r.top + r.height / 2 - (gsap.getProperty(el, "y") || 0);
            var c = corners[el.dataset.corner]();
            return axis === "x" ? c.x - cx : c.y - cy;
          };
        }

        var tl = gsap.timeline({ defaults: { ease: "power3.out" } });
        tl.fromTo(items,
          { x: fromCorner("x"), y: fromCorner("y"), scale: 0.3, opacity: 0,
            rotation: function (i, el) { return +el.dataset.r + gsap.utils.random(-60, 60); } },
          { x: 0, y: 0, scale: 1, opacity: 1,
            rotation: function (i, el) { return +el.dataset.r; },
            duration: 1.6,
            stagger: { each: 0.07, from: "random" } });

        tl.fromTo(".polaroid", { y: -36, rotation: -14, opacity: 0, scale: 0.9 },
          { y: 0, rotation: -4, opacity: 1, scale: 1, duration: 0.9, ease: "back.out(1.6)" }, 0.5);

        var paths = gsap.utils.toArray(".flower .stem, .flower .leaf");
        paths.forEach(function (p) {
          var len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        });
        gsap.set(".flower", { visibility: "visible" });
        gsap.set(".flower-head", { scale: 0, rotation: -140, opacity: 0 });

        tl.to(".flower .stem", { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 0.8)
          .to(".flower .leaf", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out", stagger: 0.25 }, 1.3)
          .to(".flower-head", { scale: 1, rotation: 0, opacity: 1, duration: 1.1, ease: "back.out(2.2)" }, 1.9)
          .add(function () {
            gsap.to(".arrow", { x: 3, y: -3, duration: 0.7, ease: "power1.inOut", yoyo: true, repeat: -1, repeatDelay: 0.5 });
            gsap.to(".flower", { rotation: 3, duration: 3.4, ease: "sine.inOut", yoyo: true, repeat: -1 });
          });

        tl.add(function () {
          items.forEach(function (el) {
            gsap.to(el, {
              y: gsap.utils.random(-10, 10),
              rotation: "+=" + gsap.utils.random(-3, 3),
              duration: gsap.utils.random(3, 5),
              ease: "sine.inOut", yoyo: true, repeat: -1
            });
          });
        });



        var flight;
        function launchPlane() {
          if (flight) flight.kill();
          var W = innerWidth, H = innerHeight;
          var pts = [
            { x: -0.12 * W, y: 0.78 * H },
            { x: 0.2 * W, y: 0.3 * H },
            { x: 0.42 * W, y: 0.62 * H },
            { x: 0.62 * W, y: 0.12 * H },
            { x: 0.84 * W, y: 0.34 * H },
            { x: 1.12 * W, y: 0.08 * H }
          ];
          gsap.set(".plane", { visibility: "visible" });
          flight = gsap.to(".plane", {
            motionPath: { path: pts, curviness: 1.6, autoRotate: true },
            duration: 10,
            delay: 2.2,
            ease: "power1.inOut",
            repeat: -1,
            repeatDelay: 4
          });
        }
        launchPlane();
        gsap.to(".plane svg", { y: -4, rotation: 5, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: -1 });
        var resizeTimer;
        function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(launchPlane, 200); }
        addEventListener("resize", onResize);
        return function () { removeEventListener("resize", onResize); };
      });

      function stackTween(trigger, end, to) {
        gsap.fromTo(".card.sheet", { scale: 1, opacity: 1, filter: "brightness(1)" }, {
          scale: to.scale,
          opacity: to.opacity,
          filter: "brightness(0.92)",
          ease: "none",
          scrollTrigger: { trigger: trigger, start: "top bottom", end: end, scrub: true }
        });
      }
      mm.add("(prefers-reduced-motion: no-preference) and (min-width: 641px)", function () {
        // cards are natural size and centered: the outgoing card fades so only one holds the focal point
        stackTween(".panel:last-child", "top top", { scale: 0.88, opacity: 0 });
      });
      mm.add("(prefers-reduced-motion: no-preference) and (max-width: 640px)", function () {
        stackTween(".player", "bottom bottom", { scale: 0.93, opacity: 1 });
      });

      mm.add("(prefers-reduced-motion: reduce)", function () {
        items.forEach(function (el) { gsap.set(el, { opacity: 1, rotation: +el.dataset.r }); });
        gsap.set(".flower", { visibility: "visible" });
        gsap.set(".flower-head", { opacity: 1 });
        gsap.set(".polaroid", { opacity: 1 });
      });
    })();
  </script>
